---
- name: Load PVWA role defaults
  ansible.builtin.include_vars:
    file: "../roles/pvwa/defaults/main.yml"

- name: Check if PVWA is already installed - 64 bit
  ansible.windows.win_reg_stat:
    path: HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{{ pvwa_guid }}
    name: Publisher
  register: pvwa_appwiz_info_64bit

- name: Check if PVWA is already installed - 32 bit
  ansible.windows.win_reg_stat:
    path: HKLM:\Software\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\{{ pvwa_guid }}
    name: Publisher
  register: pvwa_appwiz_info_32bit

- name: Check if PVWA was installed with scripted installer
  ansible.windows.win_reg_stat:
    path: HKLM:\SOFTWARE\CyberArk\PVWA
  register: pvwa_script_installation

- name: Set PVWA existence state before this run
  ansible.builtin.set_fact:
    pvwa_existed_before_run: >-
      {{
        pvwa_appwiz_info_64bit.exists
        or pvwa_appwiz_info_32bit.exists
        or pvwa_script_installation.exists
      }}

- name: Display PVWA pre-run state
  ansible.builtin.debug:
    msg:
      - "PVWA existed before this run: {{ pvwa_existed_before_run }}"
      - "PVWA 64-bit: {{ pvwa_appwiz_info_64bit.exists }}"
      - "PVWA 32-bit: {{ pvwa_appwiz_info_32bit.exists }}"
      - "PVWA scripted: {{ pvwa_script_installation.exists }}"
