---
# file: main.yml

- hosts: localhost
  connection: local

  vars_prompt:
    - name: accept_eula
      prompt: "Please accept EULA"
      default: "No"
      private: no

    - name: vault_ip
      prompt: "Please enter the Vault ip address"
      private: no

    - name: vault_password
      prompt: "Please enter the Vault Administrator password"
      private: yes

#    - name: pvwa_zip_file_path
#      prompt: "Please enter PVWA installation package location"
#      default: "/tmp/pas_packages/pvwa.zip"
#      private: no

    - name: cpm_zip_file_path
      prompt: "Please enter CPM installation package location"
      default: "/tmp/pas_packages/cpm.zip"
      private: no

  tasks:
    - name: Set required parameters from prompt
      include_tasks: set_facts.yml


# ==============================================================
# PVWA DEPLOYMENT
# ==============================================================

- hosts: pvwa
  strategy: free

  tasks:

    # ----------------------------------------------------------
    # Determine whether PVWA existed BEFORE this playbook run
    # ----------------------------------------------------------

    - name: Pre-check PVWA state
      ansible.builtin.include_tasks: pvwa_precheck.yml

    # ----------------------------------------------------------
    # Only deploy when PVWA did NOT exist before this run
    # ----------------------------------------------------------

    - name: Deploy PVWA
      ansible.builtin.include_tasks: pvwa.yml
      when:
        - not pvwa_existed_before_run


# ==============================================================
# PVWA REGISTRATION
# ==============================================================

- hosts: pvwa
  serial: 1

  tasks:

    # ----------------------------------------------------------
    # Determine whether PVWA is already registered
    # ----------------------------------------------------------

    - name: Check PVWA registration status
      ansible.windows.win_uri:
        url: "https://127.0.0.1/PasswordVault/api/server"
        validate_certs: false
        timeout: 60
      register: pvwa_server_info
      ignore_errors: true

    - name: Set PVWA registered state
      ansible.builtin.set_fact:
        pvwa_registered: true
      when:
        - pvwa_server_info.status_code is defined
        - pvwa_server_info.status_code == 200

    - name: Set PVWA registered state to false
      ansible.builtin.set_fact:
        pvwa_registered: false
      when:
        - pvwa_server_info.status_code is not defined
          or pvwa_server_info.status_code != 200

    - name: Display PVWA registration state
      ansible.builtin.debug:
        msg:
          - "PVWA existed before this run: {{ pvwa_existed_before_run }}"
          - "PVWA registered: {{ pvwa_registered }}"
          - "PVWA API status: {{ pvwa_server_info.status_code | default('unavailable') }}"

    # ----------------------------------------------------------
    # Register only an existing, unregistered PVWA
    # ----------------------------------------------------------

    - name: Register existing PVWA
      ansible.builtin.include_tasks: register_pvwa.yml
      when:
        - pvwa_existed_before_run
        - not pvwa_registered

# ==============================================================
# CPM DEPLOYMENT
# ==============================================================

- hosts: cpm
  strategy: free

  tasks:

    # ----------------------------------------------------------
    # Determine whether CPM existed BEFORE this playbook run
    # ----------------------------------------------------------

    - name: Pre-check CPM state
      ansible.builtin.include_tasks: cpm_precheck.yml

    # ----------------------------------------------------------
    # Only deploy when CPM did NOT exist before this run
    # ----------------------------------------------------------

    - name: Deploy CPM
      ansible.builtin.include_role:
        name: cpm
      vars:
        cpm_zip_file_path: "{{ cpm_zip_file_path }}"
        cpm_extract: true
        cpm_prerequisites: true
        cpm_install: true
        cpm_hardening: true
        cpm_registration: false
        cpm_clean: false
      when:
        - not cpm_existed_before_run


# ==============================================================
# CPM REGISTRATION
# ==============================================================

- hosts: cpm
  serial: 1

  tasks:

    # ----------------------------------------------------------
    # Run CPM role registration logic
    # ----------------------------------------------------------

    - name: Register existing CPM
      ansible.builtin.include_role:
        name: cpm
      vars:
        cpm_zip_file_path: "{{ cpm_zip_file_path }}"
        cpm_extract: false
        cpm_prerequisites: false
        cpm_install: false
        cpm_hardening: false
        cpm_registration: true
        cpm_clean: false
      when:
        - cpm_existed_before_run
