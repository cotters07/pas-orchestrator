# ==============================================================
# PVWA REGISTRATION
# ==============================================================

- hosts: pvwa
  serial: 1

  tasks:

    # ----------------------------------------------------------
    # Determine whether PVWA is already registered
    # ----------------------------------------------------------

    - name: Check PVWA registration status
      ansible.windows.win_uri:
        url: "https://127.0.0.1/PasswordVault/api/server"
        validate_certs: false
        timeout: 60
      register: pvwa_server_info
      ignore_errors: true

    - name: Set PVWA registered state
      ansible.builtin.set_fact:
        pvwa_registered: true
      when:
        - pvwa_server_info.status_code is defined
        - pvwa_server_info.status_code == 200

    - name: Set PVWA registered state to false
      ansible.builtin.set_fact:
        pvwa_registered: false
      when:
        - pvwa_server_info.status_code is not defined
          or pvwa_server_info.status_code != 200

    - name: Display PVWA registration state
      ansible.builtin.debug:
        msg:
          - "PVWA existed before this run: {{ pvwa_existed_before_run }}"
          - "PVWA registered: {{ pvwa_registered }}"
          - "PVWA API status: {{ pvwa_server_info.status_code | default('unavailable') }}"

    # ----------------------------------------------------------
    # Register only an existing, unregistered PVWA
    # ----------------------------------------------------------

    - name: Register existing PVWA
      ansible.builtin.include_tasks: register_pvwa.yml
      when:
        - pvwa_existed_before_run
        - not pvwa_registered
